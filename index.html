<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cnation TACTICS - High-Precision Kyle 3D Preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d181d;color:#f4f0e4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100dvh;overflow:hidden}
canvas{width:100%;height:100%;display:block;cursor:grab}
#info{position:absolute;top:16px;left:16px;background:rgba(14,28,33,0.88);border:1px solid #3c6c75;padding:12px 16px;border-radius:10px;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,0.5)}
h1{font-size:16px;color:#a8e6cf;margin-bottom:4px}
p{font-size:12px;color:#b2c9c2}
</style>
</head>
<body>

<div id="info">
  <h1>카일 (Kyle) · 고정밀 절차적 폴리곤 모델</h1>
  <p>마우스 드래그: 360도 회전 | 휠: 확대/축소</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// 1. 씬, 카메라, 렌더러 설정
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1b20);
scene.fog = new THREE.FogExp2(0x0e1b20, 0.04);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 2.2, 5.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 1.1, 0);
controls.maxPolarAngle = Math.PI / 2 + 0.05; // 바닥 아래로 내려가지 않음
controls.minDistance = 2;
controls.maxDistance = 10;

// 2. 조명 설정 (입체감 강조)
const ambient = new THREE.AmbientLight(0xdff0ea, 1.3);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xfff3d1, 3.2);
keyLight.position.set(4, 9, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;
keyLight.shadow.bias = -0.0001;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x76b4cc, 1.1);
fillLight.position.set(-6, 4, -4);
scene.add(fillLight);

// 3. 머티리얼 설정 (콘셉트 아트의 로우폴리 플랫 셰이딩)
const mat = (col) => new THREE.MeshStandardMaterial({
  color: col,
  flatShading: true, // 각진 폴리곤 느낌의 핵심
  roughness: 0.85,
  metalness: 0.15
});

const C = {
  skin: 0xf2cea5,
  hair: 0x7a4928,
  blue: 0x2d7fa3,
  navy: 0x1b4965,
  silver: 0xd8e3e7,
  darkSilver: 0x8fa3a8,
  gold: 0xe8c166,
  darkGold: 0x9c7a33,
  white: 0xf7f5ed,
  brown: 0x5c3a24,
  black: 0x211c18,
  capeOuter: 0x24628f,
  capeInner: 0x184260,
  shieldBlue: 0x235f85
};

const geomMap = {
  box: new THREE.BoxGeometry(1, 1, 1),
  ball: new THREE.SphereGeometry(1, 8, 6),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 8),
  cone: new THREE.ConeGeometry(1, 1, 8),
  rock: new THREE.DodecahedronGeometry(1, 0)
};

// 4. 고정밀 카일 캐릭터 파츠 빌더
function buildKyleGeometry() {
  const parts = [];
  const add = (type, pos, scale, col, rot = [0,0,0]) => {
    let g = geomMap[type].clone();
    g.scale(scale[0], scale[1], scale[2]);
    if(rot[0]) g.rotateX(rot[0]);
    if(rot[1]) g.rotateY(rot[1]);
    if(rot[2]) g.rotateZ(rot[2]);
    g.translate(pos[0], pos[1], pos[2]);
    
    // 정점에 단색 버텍스 컬러 주입
    const color = new THREE.Color(col);
    const posAttr = g.attributes.position;
    const colors = new Float32Array(posAttr.count * 3);
    for(let i=0; i<posAttr.count; i++) {
      colors[i*3] = color.r;
      colors[i*3+1] = color.g;
      colors[i*3+2] = color.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    parts.push(g);
  };

  // --- [1] 하체 및 부츠 ---
  for(const s of [-1, 1]) {
    const x = s * 0.13;
    // 허벅지 및 종아리 갑옷 그리브
    add('cyl', [x, 0.28, 0], [0.082, 0.32, 0.088], C.darkSilver);
    add('box', [x, 0.44, 0.05], [0.09, 0.12, 0.05], C.gold); // 무릎 보호대
    add('cyl', [x, 0.11, 0.01], [0.088, 0.22, 0.095], C.brown); // 부츠
    add('box', [x, 0.03, 0.06], [0.11, 0.06, 0.22], C.black); // 발 부츠코
  }

  // --- [2] 상체, 튜닉 및 흉갑(Breastplate) ---
  add('cone', [0, 0.68, 0], [0.35, 0.42, 0.27], C.blue); // 하단 튜닉 스커트
  add('box', [0, 0.62, 0.14], [0.18, 0.28, 0.04], C.white); // 전면 흰색 태바드
  add('cyl', [0, 0.88, 0], [0.26, 0.32, 0.21], C.navy); // 허리 및 상체
  add('cyl', [0, 0.77, 0], [0.27, 0.08, 0.22], C.brown); // 가죽 벨트
  add('box', [0, 0.77, 0.21], [0.11, 0.09, 0.04], C.gold); // 벨트 버클

  // 은빛 은장 흉갑 (입체적인 굴곡)
  add('box', [0, 1.01, 0.08], [0.38, 0.3, 0.18], C.silver);
  add('box', [0, 1.01, 0.175], [0.09, 0.24, 0.03], C.gold); // 가슴 중앙 골드 장식
  // 흉갑 중앙 아르카 엠블럼 별
  add('rock', [0, 1.01, 0.192], [0.045, 0.045, 0.025], C.gold);

  // --- [3] 입체적인 망토 (클로크) ---
  add('box', [0, 0.88, -0.21], [0.48, 0.64, 0.06], C.capeOuter, [0, 0, 0.12]);
  for(const s of [-1, 1]) {
    add('cone', [s*0.18, 0.82, -0.23], [0.17, 0.66, 0.08], C.capeInner, [0, 0, s*-0.12]);
  }
  add('torus', [0, 1.16, 0.02], [0.2, 0.18, 0.2], 0xc84646, [0, 0, Math.PI/2]); // 붉은 숄더 머플러

  // --- [4] 어깨 견갑 (Pauldron) 및 양팔 ---
  for(const s of [-1, 1]) {
    const x = s * 0.34;
    // 각진 어깨 갑옷
    add('rock', [x, 1.11, 0], [0.16, 0.16, 0.16], C.silver);
    add('box', [x, 1.06, 0], [0.18, 0.05, 0.18], C.gold);
    // 팔
    add('cyl', [x*1.04, 0.92, 0.02], [0.068, 0.24, 0.068], C.blue, [0, 0, s*0.12]);
    add('cyl', [x*1.1, 0.72, 0.08], [0.072, 0.22, 0.072], C.silver, [0, 0, s*0.06]); // 건틀릿
    add('ball', [x*1.14, 0.58, 0.12], [0.065, 0.065, 0.065], C.skin); // 손
  }

  // --- [5] 목 및 정밀 두상 & 헤어 스타일 ---
  add('cyl', [0, 1.21, 0], [0.095, 0.1, 0.095], C.skin);
  add('ball', [0, 1.42, 0], [0.26, 0.27, 0.25], C.skin); // 얼굴 베이스
  add('cyl', [0, 1.33, 0.04], [0.21, 0.15, 0.19], C.skin); // 턱선 보강
  
  // 눈썹 및 눈
  for(const s of [-1, 1]) {
    add('ball', [s*0.09, 1.43, 0.22], [0.042, 0.052, 0.02], C.white);
    add('ball', [s*0.09, 1.43, 0.235], [0.026, 0.035, 0.018], 0x1d3a4c);
    add('box', [s*0.094, 1.5, 0.225], [0.07, 0.02, 0.02], C.hair, [0, 0, s*-0.12]);
  }
  // 코와 입
  add('cone', [0, 1.39, 0.25], [0.025, 0.045, 0.03], C.skin, [Math.PI/2, 0, 0]);
  add('box', [0, 1.3, 0.235], [0.065, 0.015, 0.015], 0xa36253);

  // 컨셉트 아트와 일치하는 각진 로우폴리 갈색 머리 (앞머리 가르마 및 뒷머리 볼륨)
  add('ball', [0, 1.53, -0.02], [0.28, 0.23, 0.27], C.hair);
  add('box', [0, 1.45, -0.18], [0.46, 0.26, 0.16], C.hair);
  add('box', [0, 1.55, 0.23], [0.32, 0.04, 0.04], C.gold); // 머리띠 서클릿
  add('rock', [0, 1.55, 0.25], [0.045, 0.05, 0.025], 0x38e2ff);
  add('cone', [-0.07, 1.6, 0.21], [0.075, 0.19, 0.06], C.hair, [0, 0, 2.7]);
  add('cone', [0.08, 1.61, 0.2], [0.085, 0.21, 0.06], C.hair, [0, 0, -2.6]);
  for(const s of [-1, 1]) add('cone', [s*0.24, 1.44, 0.12], [0.06, 0.22, 0.06], C.hair, [Math.PI, 0, s*0.15]);

  // --- [6] 장비: 기사도의 검 & 카이트 실드 ---
  // 검 (오른손)
  add('cyl', [0.42, 0.62, 0.14], [0.038, 0.24, 0.038], C.brown);
  add('ball', [0.42, 0.49, 0.14], [0.058, 0.058, 0.058], C.gold);
  add('box', [0.42, 0.74, 0.14], [0.26, 0.055, 0.09], C.gold);
  add('rock', [0.42, 0.74, 0.18], [0.048, 0.06, 0.03], 0x3ce2ff);
  add('box', [0.42, 1.12, 0.14], [0.09, 0.7, 0.038], C.silver);
  add('box', [0.42, 1.08, 0.165], [0.026, 0.54, 0.02], 0x76dcf7);
  add('cone', [0.42, 1.54, 0.14], [0.065, 0.2, 0.032], C.silver);

  // 카이트 실드 (왼손)
  add('box', [-0.46, 0.82, 0.18], [0.38, 0.52, 0.06], C.gold);
  add('box', [-0.46, 0.82, 0.21], [0.31, 0.45, 0.04], C.shieldBlue);
  add('box', [-0.46, 0.82, 0.24], [0.06, 0.32, 0.02], C.gold);
  add('box', [-0.46, 0.88, 0.24], [0.22, 0.06, 0.02], C.gold);

  return mergeGeometries(parts, false);
}

// 5. 씬에 카일 및 바닥/그리드 생성
const kyleGeo = buildKyleGeometry();
kyleGeo.computeVertexNormals();
const kyleMesh = new THREE.Mesh(kyleGeo, sharedMat);
kyleMesh.castShadow = true;
kyleMesh.receiveShadow = true;
scene.add(kyleMesh);

// 은은한 마법진 바닥 패드
const pad = new THREE.Mesh(
  new THREE.RingGeometry(0.7, 0.82, 32),
  new THREE.MeshBasicMaterial({ color: 0x56f2cb, transparent: true, opacity: 0.75, side: THREE.DoubleSide })
);
pad.rotation.x = -Math.PI / 2;
pad.position.y = 0.02;
scene.add(pad);

const grid = new THREE.GridHelper(16, 16, 0x1f3c44, 0x182c33);
grid.position.y = 0.01;
scene.add(grid);

// 6. 애니메이션 루프 (미세한 숨쉬기 호흡 모션)
let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  
  // 자연스러운 상체 호흡 및 방패/검 미세 흔들림
  kyleMesh.position.y = Math.sin(t * 2.2) * 0.025;
  kyleMesh.rotation.y = Math.sin(t * 0.8) * 0.08;
  
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
