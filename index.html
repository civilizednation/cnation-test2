<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ==========================================
// 1. 자체 프로시저럴 사운드 엔진 (Web Audio API)
// ==========================================
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  ensureAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  if (type === 'step') {
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(190, now);
    osc.frequency.exponentialRampToValueAtTime(75, now + 0.09);
    g.gain.setValueAtTime(0.08, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.095);
  } else if (type === 'swing') {
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(480, now);
    osc.frequency.exponentialRampToValueAtTime(120, now + 0.16);
    g.gain.setValueAtTime(0.09, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.18);
  } else if (type === 'slashHit') {
    // 묵직한 타격음 + 노이즈 파열음
    [220, 110, 58].forEach((f, i) => {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now + i * 0.02);
      osc.frequency.exponentialRampToValueAtTime(f * 0.35, now + 0.22);
      g.gain.setValueAtTime(0.18, now + i * 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now + i * 0.02); osc.stop(now + 0.25);
    });
    noiseBurst(0.16, 1600, 180, 0.15);
  } else if (type === 'cast') {
    [440, 554.37, 659.25, 880].forEach((f, i) => {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + i * 0.06);
      osc.frequency.exponentialRampToValueAtTime(f * 1.25, now + i * 0.06 + 0.35);
      g.gain.setValueAtTime(0.07, now + i * 0.06);
      g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.36);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.37);
    });
  } else if (type === 'fireFall') {
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(620, now);
    osc.frequency.exponentialRampToValueAtTime(95, now + 0.55);
    g.gain.setValueAtTime(0.08, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.56);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.57);
  } else if (type === 'fireBoom') {
    [110, 65, 42].forEach((f, i) => {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f, now);
      osc.frequency.exponentialRampToValueAtTime(24, now + 0.65);
      g.gain.setValueAtTime(0.22 / (i + 1), now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.68);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.7);
    });
    noiseBurst(0.55, 1200, 90, 0.24);
  } else if (type === 'death') {
    [300, 220, 140, 70].forEach((f, i) => {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + i * 0.07);
      osc.frequency.exponentialRampToValueAtTime(f * 0.5, now + i * 0.07 + 0.25);
      g.gain.setValueAtTime(0.11, now + i * 0.07);
      g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.26);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now + i * 0.07); osc.stop(now + i * 0.07 + 0.27);
    });
  }
}

function noiseBurst(duration, startFreq, endFreq, volume) {
  const now = audioCtx.currentTime;
  const len = Math.floor(audioCtx.sampleRate * duration);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  const filter = audioCtx.createBiquadFilter();
  const g = audioCtx.createGain();
  src.buffer = buf;
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(startFreq, now);
  filter.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
  g.gain.setValueAtTime(volume, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + duration);
  src.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
  src.start(now); src.stop(now + duration);
}

// ==========================================
// 2. 도형 베이킹 및 정밀 캐릭터/몬스터 모델러
// ==========================================
const geo = {
  box: new THREE.BoxGeometry(1, 1, 1),
  ball: new THREE.SphereGeometry(1, 12, 10),
  cone: new THREE.ConeGeometry(1, 1, 10),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 10),
  rock: new THREE.DodecahedronGeometry(1, 0),
  torus: new THREE.TorusGeometry(1, 0.22, 8, 16)
};
const sharedMat = new THREE.MeshToonMaterial({ vertexColors: true });

function bake(parts) {
  const arr = parts.map(p => {
    const [type, pos, scale, col, rot = 0, rotX = 0, rotY = 0] = p;
    let g = geo[type].index ? geo[type].toNonIndexed() : geo[type].clone();
    g.scale(scale[0], scale[1], scale[2]);
    if (rotX) g.rotateX(rotX);
    if (rotY) g.rotateY(rotY);
    if (rot) g.rotateZ(rot);
    g.translate(pos[0], pos[1], pos[2]);
    const color = new THREE.Color(col);
    const a = new Float32Array(g.attributes.position.count * 3);
    for (let i = 0; i < a.length; i += 3) {
      a[i] = color.r; a[i + 1] = color.g; a[i + 2] = color.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(a, 3));
    return g;
  });
  const m = mergeGeometries(arr, false);
  arr.forEach(g => g.dispose());
  return m;
}

}

  const p = [], add = (...a) => p.push(a);

function projectToScreen(vec3) {
  const v = vec3.clone().project(camera);
  return {
    x: (v.x * 0.5 + 0.5) * viewport.clientWidth,
    y: (-v.y * 0.5 + 0.5) * viewport.clientHeight
  };
}

      life: 0.75 + Math.random() * 0.25
    });
  }
}

function tween(ms, fn) {
  const start = performance.now();
  return new Promise(resolve => {
    function step(now) {
      const t = Math.min(1, (now - start) / ms);
      const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      fn(ease, t);
      if (t < 1) requestAnimationFrame(step);
      else resolve();
    }
    requestAnimationFrame(step);
  });
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// 6. 메인 렌더링 루프
// ==========================================
let lastTime = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  // 카메라 부드러운 추적 및 흔들림(Shake)
  camAngle += (targetAngle - camAngle) * Math.min(1, dt * 8);
  currentZoom += (baseZoom - currentZoom) * Math.min(1, dt * 7);
  camLook.lerp(targetLook, Math.min(1, dt * 8));

  camera.zoom = currentZoom;
  camera.updateProjectionMatrix();
  camera.position.set(
    camLook.x + Math.sin(camAngle) * 14,
    13.5 + camLook.y,
    camLook.z + Math.cos(camAngle) * 14
  );
  if (shakePower > 0.002) {
    camera.position.x += (Math.random() - 0.5) * shakePower;
    camera.position.y += (Math.random() - 0.5) * shakePower;
    shakePower *= Math.exp(-dt * 16);
  }
  camera.lookAt(camLook);

  // 유닛 숨쉬기 모션 & 기울기 반영
  [kyle, ria, enemy].forEach((u, idx) => {
    if (!u.visible) return;
    u.userData.body.position.y = Math.sin(now * 0.0035 + idx) * 0.024;
    if (u !== enemy || !isPlaying) {
      u.userData.body.rotation.z = (u.userData.attackLean || 0) + (u.userData.hitLean || 0);
    }
  });

  // 파티클 업데이트
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.m.position.addScaledVector(p.v, dt);
    p.v.y -= dt * 4.5;
    p.m.material.opacity = Math.max(0, p.life);
    if (p.life <= 0) {
      fxGroup.remove(p.m);
      p.m.geometry.dispose();
      p.m.material.dispose();
      particles.splice(i, 1);
    }
  }

  // 머리 위 이름/체력바 좌표 동기화
  const syncTag = (unitObj, elId, heightOffset = 1.45) => {
    const el = document.getElementById(elId);
    if (!unitObj.visible) return;
    const p = projectToScreen(unitObj.position.clone().add(new THREE.Vector3(0, heightOffset, 0)));
    el.style.left = `${p.x}px`;
    el.style.top = `${p.y}px`;
  };
  syncTag(kyle, 'tagKyle', 1.42);
  syncTag(ria, 'tagRia', 1.58);
  syncTag(enemy, 'tagEnemy', 1.48);

  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

// 첫 로드 후 0.6초 뒤 자동 1회 시연
setTimeout(() => runCoopSequence(), 600);
</script>
</body>
</html>
