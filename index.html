{

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// =========================================================
// 1. 자체 프로시저럴 사운드 합성기 (효과음 + 전투 심장박동)
// =========================================================
let audioCtx = null;
function unlockAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
window.addEventListener('pointerdown', unlockAudio, { passive: true });

function sfx(type) {
  unlockAudio();
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = (freq, endFreq, dur, wave = 'sine', gainVal = 0.09, delay = 0) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = wave;
    o.frequency.setValueAtTime(freq, t + delay);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), t + delay + dur);
    g.gain.setValueAtTime(gainVal, t + delay);
    g.gain.exponentialRampToValueAtTime(0.001, t + delay + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t + delay); o.stop(t + delay + dur + 0.01);
  };
  const noise = (dur, startF, endF, gainVal = 0.12) => {
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const arr = buf.getChannelData(0);
    for (let i = 0; i < len; i++) arr[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = buf; f.type = 'lowpass';
    f.frequency.setValueAtTime(startF, t);
    f.frequency.exponentialRampToValueAtTime(endF, t + dur);
    g.gain.setValueAtTime(gainVal, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    src.start(t); src.stop(t + dur);
  };

  if (type === 'step') osc(180, 75, 0.08, 'triangle', 0.06);
  else if (type === 'swing') osc(440, 130, 0.14, 'sawtooth', 0.08);
  else if (type === 'arrow') { osc(920, 280, 0.11, 'triangle', 0.06); noise(0.08, 3500, 900, 0.05); }
  else if (type === 'hit') { osc(190, 52, 0.19, 'triangle', 0.15); noise(0.13, 1600, 190, 0.13); }
  else if (type === 'crit') { osc(280, 45, 0.3, 'sawtooth', 0.2); osc(560, 110, 0.25, 'triangle', 0.14); noise(0.24, 2400, 120, 0.2); }
  else if (type === 'cast') { [440, 554, 659, 880].forEach((f, i) => osc(f, f * 1.2, 0.28, 'sine', 0.06, i * 0.05)); }
  else if (type === 'heal') { [523, 659, 784, 1046].forEach((f, i) => osc(f, f * 1.05, 0.35, 'sine', 0.07, i * 0.06)); }
  else if (type === 'fire') { osc(150, 34, 0.55, 'sawtooth', 0.2); noise(0.5, 1300, 90, 0.22); }
  else if (type === 'ice') { [1200, 1650, 2100].forEach((f, i) => osc(f, f * 0.7, 0.22, 'sine', 0.07, i * 0.04)); noise(0.2, 4200, 1200, 0.08); }
  else if (type === 'thunder') { osc(680, 48, 0.42, 'sawtooth', 0.19); noise(0.38, 3200, 160, 0.22); }
  else if (type === 'death') { [260, 180, 110, 55].forEach((f, i) => osc(f, f * 0.55, 0.2, 'sine', 0.09, i * 0.05)); }
  else if (type === 'fanfare') { [392, 494, 587, 784].forEach((f, i) => osc(f, f, 0.4, 'triangle', 0.09, i * 0.09)); }
}

// =========================================================
// 2. 도형 베이킹 & 6명 영웅 + 다양한 몬스터 3D 모델러
// =========================================================
const geo = {
  box: new THREE.BoxGeometry(1, 1, 1),
  ball: new THREE.SphereGeometry(1, 10, 8),
  cone: new THREE.ConeGeometry(1, 1, 8),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 8),
  rock: new THREE.DodecahedronGeometry(1, 0),
  torus: new THREE.TorusGeometry(1, 0.22, 7, 14)
};
const sharedMat = new THREE.MeshToonMaterial({ vertexColors: true });

function bake(parts) {
  const arr = parts.map(p => {
    const [type, pos, scale, col, rot = 0, rotX = 0, rotY = 0] = p;
    let g = geo[type].index ? geo[type].toNonIndexed() : geo[type].clone();
    g.scale(scale[0], scale[1], scale[2]);
    if (rotX) g.rotateX(rotX);
    if (rotY) g.rotateY(rotY);
    if (rot) g.rotateZ(rot);
    g.translate(pos[0], pos[1], pos[2]);
    const color = new THREE.Color(col);
    const a = new Float32Array(g.attributes.position.count * 3);
    for (let i = 0; i < a.length; i += 3) {
      a[i] = color.r; a[i + 1] = color.g; a[i + 2] = color.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(a, 3));
    return g;
  });
  const m = mergeGeometries(arr, false);
  arr.forEach(g => g.dispose());
  return m;
}

// 6인 영웅 + 몬스터 파츠 생성기 (game.js 디자인 + 고정밀 영웅 + 투구 적군 통합)
function buildUnitParts(kind, colorOverride) {
  const p = [], add = (...a) => p.push(a);
  const skin = 0xf4cfa8;

  if (kind === 'kyle') {
    const tunic = 0x2d7fa3, darkBlue = 0x1b4965, silver = 0xdce6ea, gold = 0xe8c166, hair = 0x7a4928, boot = 0x4a372b;
    for (const s of [-1, 1]) {
      const x = s * 0.125;
      add('cyl', [x, 0.24, 0], [0.078, 0.22, 0.082], 0x324a5e);
      add('cyl', [x, 0.12, 0.01], [0.082, 0.18, 0.09], boot);
      add('box', [x, 0.035, 0.05], [0.135, 0.07, 0.21], 0x2b211b);
      add('ball', [x, 0.23, 0.08], [0.065, 0.065, 0.04], silver);
    }
    add('cone', [0, 0.38, 0], [0.31, 0.36, 0.24], tunic);
    add('box', [0, 0.34, 0.14], [0.14, 0.26, 0.04], 0xf2efe4);
    add('cyl', [0, 0.59, 0], [0.23, 0.28, 0.19], tunic);
    add('box', [0, 0.6, 0.08], [0.34, 0.26, 0.16], silver);
    add('box', [0, 0.6, 0.165], [0.08, 0.22, 0.03], gold);
    add('torus', [0, 0.73, 0.02], [0.18, 0.16, 0.18], 0xc84646, 0, Math.PI / 2);
    add('box', [0, 0.48, -0.19], [0.46, 0.56, 0.06], darkBlue, 0, 0.12);
    for (const s of [-1, 1]) {
      const x = s * 0.31;
      add('ball', [x, 0.69, 0], [0.13, 0.11, 0.14], silver);
      add('cyl', [x * 1.05, 0.52, 0.04], [0.065, 0.26, 0.065], tunic, s * 0.12);
      add('ball', [x * 1.1, 0.36, 0.1], [0.06, 0.06, 0.06], skin);
    }
    add('ball', [0, 0.92, 0], [0.235, 0.25, 0.225], skin);
    for (const s of [-1, 1]) {
      add('ball', [s * 0.085, 0.91, 0.205], [0.04, 0.05, 0.02], 0xffffff);
      add('ball', [s * 0.085, 0.91, 0.218], [0.026, 0.036, 0.018], 0x183442);
    }
    add('ball', [0, 1.0, -0.02], [0.25, 0.21, 0.24], hair);
    add('box', [0, 1.01, 0.215], [0.3, 0.04, 0.03], gold);
    add('box', [0.36, 0.78, 0.14], [0.085, 0.62, 0.035], silver);
    add('cone', [0.36, 1.15, 0.14], [0.065, 0.18, 0.03], 0x79d7f7);
    add('box', [0.36, 0.46, 0.14], [0.24, 0.05, 0.09], gold);
    add('box', [-0.38, 0.48, 0.16], [0.28, 0.38, 0.05], gold);
    add('box', [-0.38, 0.48, 0.18], [0.23, 0.33, 0.04], 0x265f82);
  } else if (kind === 'ria') {
    const lilac = 0xb589d6, deepPurple = 0x6b458c, cream = 0xfaf3e0, gold = 0xf2cf72, hair = 0xebebf5;
    for (const s of [-1, 1]) add('cyl', [s * 0.1, 0.14, 0], [0.06, 0.22, 0.06], cream);
    add('cone', [0, 0.28, 0], [0.35, 0.34, 0.31], cream);
    add('cone', [0, 0.35, 0], [0.33, 0.42, 0.29], lilac);
    add('cyl', [0, 0.56, 0], [0.185, 0.26, 0.16], deepPurple);
    add('cone', [0, 0.64, 0], [0.27, 0.18, 0.23], lilac, Math.PI);
    add('ball', [0, 0.59, 0.17], [0.075, 0.085, 0.045], 0xffe885);
    for (const s of [-1, 1]) {
      add('ball', [s * 0.24, 0.64, 0], [0.095, 0.095, 0.095], lilac);
      add('cone', [s * 0.27, 0.49, 0.04], [0.09, 0.22, 0.09], lilac, s * 0.15);
    }
    add('ball', [0, 0.9, 0], [0.23, 0.24, 0.22], skin);
    for (const s of [-1, 1]) {
      add('ball', [s * 0.082, 0.89, 0.21], [0.032, 0.044, 0.02], 0x6f3aa8);
      add('cone', [s * 0.2, 0.75, 0.1], [0.055, 0.28, 0.055], hair, Math.PI, -0.1);
    }
    add('cyl', [0, 1.03, -0.01], [0.38, 0.035, 0.36], deepPurple, 0, -0.1);
    add('cone', [0, 1.25, -0.04], [0.25, 0.46, 0.24], lilac, 0, -0.15);
    add('cyl', [0.36, 0.64, 0.06], [0.028, 1.12, 0.028], 0x8c6d46);
    add('torus', [0.36, 1.24, 0.06], [0.13, 0.18, 0.13], gold);
    add('rock', [0.36, 1.24, 0.06], [0.095, 0.125, 0.095], 0xe29eff);
  } else if (kind === 'bran') {
    const bronze = 0xb88752, steel = 0x829499, gold = 0xffe082, cape = 0x2a628f;
    for (const s of [-1, 1]) {
      add('cyl', [s * 0.14, 0.18, 0], [0.1, 0.28, 0.1], steel);
      add('box', [s * 0.14, 0.05, 0.05], [0.16, 0.1, 0.24], 0x3b3026);
    }
    add('box', [0, 0.54, 0], [0.48, 0.5, 0.34], bronze);
    add('box', [0, 0.56, 0.19], [0.38, 0.42, 0.08], steel);
    add('box', [0, 0.56, 0.24], [0.1, 0.34, 0.03], gold);
    add('box', [0, 0.5, -0.21], [0.52, 0.58, 0.06], cape); // 아군 식별용 푸른 망토
    for (const s of [-1, 1]) {
      add('box', [s * 0.36, 0.7, 0], [0.26, 0.24, 0.36], steel);
      add('box', [s * 0.36, 0.82, 0], [0.28, 0.05, 0.38], gold);
    }
    add('ball', [0, 0.92, 0], [0.24, 0.25, 0.23], skin);
    add('box', [0, 0.8, 0.21], [0.28, 0.14, 0.09], 0x5c4028); // 턱수염
    for (const s of [-1, 1]) add('ball', [s * 0.085, 0.92, 0.22], [0.028, 0.038, 0.02], 0x24343b);
    add('cyl', [0, 1.05, 0], [0.25, 0.12, 0.25], gold); // 성기사 서클릿
    for (const s of [-1, 1]) add('cone', [s * 0.25, 1.15, 0], [0.06, 0.24, 0.1], 0xffffff, s * -0.35);
    // 초대형 십자 성채 방패 & 워해머
    add('box', [-0.48, 0.5, 0.18], [0.46, 0.64, 0.09], steel);
    add('box', [-0.48, 0.5, 0.24], [0.1, 0.54, 0.04], gold);
    add('box', [-0.48, 0.54, 0.24], [0.34, 0.1, 0.04], gold);
    add('cyl', [0.42, 0.56, 0.12], [0.055, 0.72, 0.055], 0x5e4934);
    add('box', [0.42, 0.94, 0.12], [0.28, 0.22, 0.22], steel);
  } else if (kind === 'sera') {
    const green = 0x528a58, mint = 0x8fd99f, gold = 0xe8c76b, wood = 0x8f6840;
    for (const s of [-1, 1]) add('cyl', [s * 0.11, 0.18, 0], [0.072, 0.28, 0.075], 0x4b3a2c);
    add('cone', [0, 0.38, 0], [0.31, 0.44, 0.25], green);
    add('cyl', [0, 0.58, 0], [0.2, 0.28, 0.17], mint);
    add('cone', [0, 0.66, 0], [0.28, 0.18, 0.24], green, Math.PI);
    add('cyl', [-0.22, 0.6, -0.2], [0.1, 0.48, 0.1], wood, -0.38); // 화살통
    add('ball', [0, 0.9, 0], [0.23, 0.24, 0.22], skin);
    for (const s of [-1, 1]) add('ball', [s * 0.08, 0.9, 0.21], [0.028, 0.04, 0.02], 0x1e5c3a);
    add('ball', [0, 0.98, -0.02], [0.24, 0.18, 0.23], gold);
    add('cone', [0, 1.17, -0.06], [0.28, 0.36, 0.26], green, 0, -0.2);
    add('cone', [0.16, 1.24, 0.05], [0.04, 0.24, 0.08], 0xffffff, -0.5); // 깃털
    // 대형 엘프 장궁
    add('cyl', [0.4, 0.64, 0.12], [0.03, 0.88, 0.03], gold);
    add('cyl', [0.48, 0.86, 0.12], [0.025, 0.44, 0.025], gold, -0.55);
    add('cyl', [0.48, 0.42, 0.12], [0.025, 0.44, 0.025], gold, 0.55);
    add('cyl', [0.54, 0.64, 0.12], [0.008, 0.84, 0.008], 0xffffff);
  } else if (kind === 'luna') {
    const white = 0xf7f2e1, gold = 0xe8c468, pinkHair = 0xd98e86, sky = 0x8cebe2;
    add('cone', [0, 0.36, 0], [0.36, 0.68, 0.32], white);
    add('box', [0, 0.46, 0.2], [0.14, 0.48, 0.04], gold);
    add('cyl', [0, 0.6, 0], [0.2, 0.28, 0.17], white);
    add('torus', [0, 0.72, 0], [0.2, 0.15, 0.18], gold, 0, Math.PI / 2);
    add('ball', [0, 0.9, 0], [0.23, 0.24, 0.22], skin);

// 3. 18×18 전장 지형 생성 및 씬 설정
// =========================================================
const MAP_SIZE = 18;
const viewport = document.getElementById('viewport');
const canvas = document.getElementById('battleCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 160);
scene.add(new THREE.HemisphereLight(0xeaf5d9, 0x1e3540, 2.45));
const sunLight = new THREE.DirectionalLight(0xffedc7, 3.0);
sunLight.position.set(-9, 18, 11);
scene.add(sunLight);

const terrainGroup = new THREE.Group();
const unitGroup = new THREE.Group();
const fxGroup = new THREE.Group();
scene.add(terrainGroup, unitGroup, fxGroup);

let heightMap = [];
function getTileHeight(x, z) {
  const gx = Math.max(0, Math.min(MAP_SIZE - 1, Math.round(x + (MAP_SIZE - 1) / 2)));
  const gz = Math.max(0, Math.min(MAP_SIZE - 1, Math.round(z + (MAP_SIZE - 1) / 2)));
  return heightMap[gz * MAP_SIZE + gx] || 0;
}
function worldPos(gx, gz) {
  const wx = gx - (MAP_SIZE - 1) / 2;
  const wz = gz - (MAP_SIZE - 1) / 2;
  const h = heightMap[gz * MAP_SIZE + gx] || 0;
  return new THREE.Vector3(wx, h * 0.32 + 0.02, wz);
}

function clearGroup(g) {
  while (g.children.length) {
    const c = g.children[0];
    c.traverse(o => {
      if (o.geometry && !Object.values(geo).includes(o.geometry)) o.geometry.dispose();
      if (o.material && o.material !== sharedMat) o.material.dispose();
    });
    g.remove(c);
  }
}

function build18x18Map(sceneIndex) {
  clearGroup(terrainGroup);
  heightMap = new Array(MAP_SIZE * MAP_SIZE).fill(0);
  const parts = [];
  const add = (...a) => parts.push(a);

  for (let gz = 0; gz < MAP_SIZE; gz++) {
    for (let gx = 0; gx < MAP_SIZE; gx++) {
      const wx = gx - (MAP_SIZE - 1) / 2;
      const wz = gz - (MAP_SIZE - 1) / 2;
      let h = 0;
      let col = 0x85b08b;

      if (sceneIndex === 0) {
        // 장면 1: 엘렌 고대 숲 (중앙 평원 + 외곽 언덕 + 소나무 숲)
        const distCenter = Math.hypot(wx, wz);
        h = distCenter > 6.5 ? 2 : distCenter > 4.2 ? 1 : 0;
        if (Math.abs(wx) <= 2 && Math.abs(wz) <= 6) h = 0;
        col = (gx + gz) % 2 === 0 ? 0x82b088 : 0x739e7a;
        if (Math.abs(wx) <= 1) col = 0x9eb2a8; // 중앙 돌길
      } else if (sceneIndex === 1) {
        // 장면 2: 에테르 수로 도하 (황토 협곡 + 중앙 강물 + 2개의 다리)
        const isRiver = Math.abs(wz) <= 1;
        const isBridge = isRiver && (Math.abs(wx + 3.5) <= 1 || Math.abs(wx - 3.5) <= 1);
        h = isRiver && !isBridge ? -0.4 : (Math.abs(wz) >= 6 ? 2 : Math.abs(wz) >= 3 ? 1 : 0);
        col = isBridge ? 0xc8b084 : isRiver ? 0x22687e : ((gx + gz) % 2 === 0 ? 0xb4966b : 0xa3875e);
      } else {
        // 장면 3: 코어 심층 결전 (고대 유적 석재 타일 + 에테르 결정 기둥)
        const ringDist = Math.max(Math.abs(wx), Math.abs(wz));
        h = ringDist >= 7 ? 2 : ringDist <= 2 ? 1 : 0;
        col = ringDist <= 2 ? 0x679c99 : ((gx + gz) % 2 === 0 ? 0x7b8f8d : 0x687c7a);
      }

      heightMap[gz * MAP_SIZE + gx] = Math.max(0, h);
      const boxH = 0.45 + Math.max(0, h) * 0.32;
      add('box', [wx, boxH / 2 - 0.45 + (h < 0 ? -0.12 : 0), wz], [0.97, boxH, 0.97], col);

      // 외곽 장식물(나무, 바위, 에테르 수정 기둥)
      const topY = Math.max(0, h) * 0.32;
      const isEdge = Math.abs(wx) >= 6 || Math.abs(wz) >= 6;
      if (isEdge && (gx * 7 + gz * 13) % 11 === 0) {
        if (sceneIndex === 0) {
          add('cyl', [wx, topY + 0.25, wz], [0.07, 0.5, 0.07], 0x6e5d45);
          add('cone', [wx, topY + 0.68, wz], [0.38, 0.75, 0.38], 0x396e5a);
          add('cone', [wx, topY + 0.98, wz], [0.26, 0.52, 0.26], 0x58916d);
        } else if (sceneIndex === 1) {
          add('rock', [wx, topY + 0.16, wz], [0.22, 0.2, 0.22], 0x8f7c63);
        } else {
          add('box', [wx, topY + 0.45, wz], [0.34, 0.9, 0.34], 0x526b6e);
          add('rock', [wx, topY + 1.05, wz], [0.18, 0.32, 0.18], 0x84f2e2);
        }
      }
    }
  }
  terrainGroup.add(new THREE.Mesh(bake(parts), sharedMat));
}

// 4. 유닛 생성 및 관리
// =========================================================
const units = new Map();
const tagsContainer = document.getElementById('tagsContainer');

function spawnUnit(id, name, kind, team, gx, gz, scale = 1, isBoss = false, colorOverride = null) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(bake(buildUnitParts(kind, colorOverride)), sharedMat);
  body.scale.setScalar(scale);
  g.add(body);

  const ringGeo = team === 'ally'
    ? new THREE.RingGeometry(0.35, 0.43, 28)
    : new THREE.RingGeometry(0.36 * scale, 0.44 * scale, 6);
  const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
    color: team === 'ally' ? 0x56f2cb : (isBoss ? 0xffd257 : 0xeb5252),
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.85
  }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.025;
  g.add(ring);

  const pos = worldPos(gx, gz);
  g.position.copy(pos);
  g.rotation.y = team === 'ally' ? 0 : Math.PI; // 아군은 북쪽(-Z), 적군은 남쪽(+Z) 주시
  unitGroup.add(g);

  const tag = document.createElement('div');
  tag.className = `unit-tag ${team}${isBoss ? ' boss' : ''}`;
  tag.innerHTML = `<div class="name">${name}</div><div class="hp-box"><div class="hp-fill"></div></div>`;
  tagsContainer.appendChild(tag);

  const u = { id, name, kind, team, gx, gz, group: g, body, tag, hpFill: tag.querySelector('.hp-fill'), hp: 100, scale, isBoss, alive: true, leanX: 0, leanZ: 0 };
  units.set(id, u);
  return u;
}

// =========================================================
// 5. 시네마틱 카메라 & 이펙트 연출 함수들
// =========================================================
let camAngle = 0.55, targetAngle = 0.55;
let camZoom = 0.82, targetZoom = 0.82;
const camLook = new THREE.Vector3(0, 0.5, 0);
const targetLook = new THREE.Vector3(0, 0.5, 0);
let shakePower = 0;
const particles = [];
let runToken = 0;

function setCameraTarget(x, z, zoom, angle, text, bannerText = null) {
  targetLook.set(x, 0.6, z);
  targetZoom = zoom;
  if (angle !== null && angle !== undefined) targetAngle = angle;
  if (text) document.getElementById('narrativeText').textContent = text;
  if (bannerText) {
    const b = document.getElementById('banner');
    b.textContent = bannerText;
    b.classList.add('show');
  }
}

function project(vec3) {
  const v = vec3.clone().project(camera);
  return {
    x: (v.x * 0.5 + 0.5) * viewport.clientWidth,
    y: (-v.y * 0.5 + 0.5) * viewport.clientHeight
  };
}

function showFloatText(pos, text, style = '') {
  const p = project(pos.clone().add(new THREE.Vector3(0, 1.4, 0)));
  const el = document.createElement('div');
  el.className = `float-dmg ${style}`;
  el.textContent = text;
  el.style.left = `${p.x}px`;
  el.style.top = `${p.y}px`;
  document.getElementById('hud').appendChild(el);
  setTimeout(() => el.remove(), 980);
}

function burstParticles(pos, color, count = 24, speed = 3.2) {
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.045 + Math.random() * 0.05, 5, 4),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
    );
    m.position.copy(pos).add(new THREE.Vector3(0, 0.55, 0));
    fxGroup.add(m);
    particles.push({
      m,
      v: new THREE.Vector3((Math.random() - 0.5) * speed, Math.random() * speed + 1.1, (Math.random() - 0.5) * speed),
      life: 0.7 + Math.random() * 0.3
    });
  }
}

function tween(ms, fn, token) {
  const start = performance.now();
  return new Promise(resolve => {
    function step(now) {
      if (token !== runToken) return resolve(false);
      const t = Math.min(1, (now - start) / ms);
      const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      fn(ease, t);
      if (t < 1) requestAnimationFrame(step);
      else resolve(true);
    }
    requestAnimationFrame(step);
  });
}

function wait(ms, token) {
  return new Promise(resolve => setTimeout(() => resolve(token === runToken), ms));
}

async function moveUnit(id, toGx, toGz, ms, token) {
  const u = units.get(id);
  if (!u || !u.alive) return;
  const start = u.group.position.clone();
  const end = worldPos(toGx, toGz);
  u.group.rotation.y = Math.atan2(end.x - start.x, end.z - start.z);
  sfx('step');
  await tween(ms, e => {
    u.group.position.lerpVectors(start, end, e);
    u.group.position.y += Math.sin(e * Math.PI) * 0.25;
  }, token);
  u.gx = toGx; u.gz = toGz;
}

async function meleeStrike(attackerId, targetId, dmg, isCrit, color, token) {
  const a = units.get(attackerId), b = units.get(targetId);
  if (!a || !b || !a.alive || !b.alive) return;
  const start = a.group.position.clone();
  const targetPos = b.group.position.clone();
  const dir = targetPos.clone().sub(start).setY(0).normalize();
  a.group.rotation.y = Math.atan2(dir.x, dir.z);

  if (isCrit) document.getElementById('critOverlay').classList.add('show');

  // 뒤로 젖혔다가 베기
  await tween(200, e => {
    a.group.position.copy(start).addScaledVector(dir, -0.2 * e);
    a.leanX = -0.28 * e;
  }, token);
  sfx('swing');

  const arc = new THREE.Mesh(
    new THREE.TorusGeometry(0.65, 0.06, 6, 18, Math.PI * 0.9),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95, side: THREE.DoubleSide })
  );
  arc.position.copy(targetPos).add(new THREE.Vector3(0, 0.65, 0));
  arc.rotation.x = Math.PI / 2;
  fxGroup.add(arc);

  await tween(120, e => {
    a.group.position.copy(start).addScaledVector(dir, 0.55 * e);
    a.leanX = 0.35 * e;
    arc.rotation.z = -1.4 + e * 2.8;
  }, token);

  sfx(isCrit ? 'crit' : 'hit');
  shakePower = isCrit ? 0.38 : 0.22;
  burstParticles(targetPos, color, isCrit ? 36 : 22, 3.4);
  showFloatText(targetPos, `${isCrit ? 'CRIT ' : ''}-${dmg}`, isCrit ? 'crit' : '');
  b.hp = Math.max(0, b.hp - dmg);
  b.hpFill.style.width = `${b.hp}%`;

  await tween(180, e => {
    const push = Math.sin(e * Math.PI);
    b.group.position.copy(targetPos).addScaledVector(dir, 0.32 * push);
    b.leanZ = 0.28 * push;
    arc.material.opacity = 1 - e;
  }, token);

  fxGroup.remove(arc); arc.geometry.dispose(); arc.material.dispose();
  b.group.position.copy(targetPos); b.leanZ = 0;
  document.getElementById('critOverlay').classList.remove('show');

  if (b.hp <= 0) killUnit(targetId, token);
  await tween(180, e => {
    a.group.position.lerpVectors(start.clone().addScaledVector(dir, 0.55), start, e);
    a.leanX = 0.35 * (1 - e);
  }, token);
}

async function arrowVolley(attackerId, targetIds, dmg, elementColor, token) {
  const a = units.get(attackerId);
  if (!a || !a.alive) return;
  sfx('arrow');
  const arrows = [];
  for (const tid of targetIds) {
    const t = units.get(tid);
    if (!t || !t.alive) continue;
    const mesh = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.55, 6), new THREE.MeshBasicMaterial({ color: elementColor }));
    mesh.rotation.x = Math.PI / 2;
    fxGroup.add(mesh);
    arrows.push({ mesh, start: a.group.position.clone().add(new THREE.Vector3(0, 0.9, 0)), end: t.group.position.clone().add(new THREE.Vector3(0, 0.6, 0)), target: t });
  }
  await tween(420, (e, raw) => {
    for (const ar of arrows) {
      ar.mesh.position.lerpVectors(ar.start, ar.end, raw);
      ar.mesh.position.y += Math.sin(raw * Math.PI) * 1.6;
    }
  }, token);
  sfx('hit');
  shakePower = 0.2;
  for (const ar of arrows) {
    fxGroup.remove(ar.mesh); ar.mesh.geometry.dispose(); ar.mesh.material.dispose();
    burstParticles(ar.target.group.position, elementColor, 18, 2.8);
    showFloatText(ar.target.group.position, `-${dmg}`);
    ar.target.hp = Math.max(0, ar.target.hp - dmg);
    ar.target.hpFill.style.width = `${ar.target.hp}%`;
    if (ar.target.hp <= 0) killUnit(ar.target.id, token);
  }
}

async function areaSpell(casterId, centerGx, centerGz, targetIds, dmg, kind, token) {
  const caster = units.get(casterId);
  const center = worldPos(centerGx, centerGz);
  const colors = { fire: 0xff551a, ice: 0x7ce8ff, thunder: 0xffe866, heal: 0x79ffad, holy: 0xfff099 };
  const col = colors[kind] || 0xff6622;

  sfx(kind === 'heal' ? 'heal' : 'cast');
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(1.4, 1.85, 36),
    new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.copy(center).add(new THREE.Vector3(0, 0.05, 0));
  fxGroup.add(ring);

  if (caster) {
    caster.group.rotation.y = Math.atan2(center.x - caster.group.position.x, center.z - caster.group.position.z);
  }

  const orb = new THREE.Mesh(
    new THREE.SphereGeometry(kind === 'fire' ? 0.65 : 0.42, 14, 12),
    new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.92 })
  );
  fxGroup.add(orb);

  await tween(520, (e, raw) => {
    ring.rotation.z = raw * 4;
    ring.scale.setScalar(0.5 + 0.65 * e);
    if (kind === 'fire' || kind === 'thunder') {
      orb.position.set(center.x, 5.2 * (1 - raw * raw) + 0.4, center.z);
    } else {
      orb.position.set(center.x, 0.3 + Math.sin(raw * Math.PI) * 1.2, center.z);
      orb.scale.setScalar(0.6 + e * 1.4);
    }
  }, token);

  sfx(kind === 'heal' ? 'heal' : kind === 'ice' ? 'ice' : kind === 'thunder' ? 'thunder' : 'fire');
  shakePower = kind === 'heal' ? 0.08 : 0.42;

  const pillar = new THREE.Mesh(
    new THREE.CylinderGeometry(1.1, 1.4, 4.2, 18, 1, true),
    new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
  );
  pillar.position.copy(center).add(new THREE.Vector3(0, 2.1, 0));
  fxGroup.add(pillar);

  burstParticles(center, col, 48, 4.4);

  for (const tid of targetIds) {
    const t = units.get(tid);
    if (!t || !t.alive) continue;
    if (kind === 'heal') {
      t.hp = Math.min(100, t.hp + dmg);
      t.hpFill.style.width = `${t.hp}%`;
      showFloatText(t.group.position, `+${dmg} HP`, 'heal');
    } else {
      t.hp = Math.max(0, t.hp - dmg);
      t.hpFill.style.width = `${t.hp}%`;
      showFloatText(t.group.position, `-${dmg}`, dmg >= 90 ? 'crit' : '');
      if (t.hp <= 0) killUnit(t.id, token);
    }
  }

  await tween(420, e => {
    orb.scale.setScalar(1 + e * 3.5);
    orb.material.opacity = 1 - e;
    pillar.scale.set(1 + e * 0.7, 1 + e * 0.3, 1 + e * 0.7);
    pillar.material.opacity = 0.85 * (1 - e);
    ring.material.opacity = 0.9 * (1 - e);
  }, token);

  [ring, orb, pillar].forEach(o => { fxGroup.remove(o); o.geometry.dispose(); o.material.dispose(); });
}

async function killUnit(id, token) {
  const u = units.get(id);
  if (!u || !u.alive) return;
  u.alive = false;
  u.tag.style.opacity = '0';
  sfx('death');
  burstParticles(u.group.position, 0xff5252, 28, 3.0);
  tween(520, e => {
    u.group.rotation.y += 0.25;
    u.group.position.y -= 0.015;
    u.group.scale.setScalar(Math.max(0.001, 1 - e));
  }, token).then(() => { u.group.visible = false; });
}

// =========================================================
// 6. 3가지 전투 장면 시나리오 (각 30초 구성)
// =========================================================
let currentSceneIdx = 0;
let sceneStartTime = performance.now();

function setupSceneUnits(idx) {
  clearGroup(unitGroup);
  clearGroup(fxGroup);
  tagsContainer.innerHTML = '';
  units.clear();

  // 아군 6명 공통 스폰 (남쪽 진영 배치)
  spawnUnit('bran', '⬟ 브란', 'bran', 'ally', 8, 12);
  spawnUnit('kyle', '⚔ 카일', 'kyle', 'ally', 9, 12);
  spawnUnit('nero', '◈ 네로', 'nero', 'ally', 6, 13);
  spawnUnit('sera', '➶ 세라', 'sera', 'ally', 11, 13);
  spawnUnit('ria', '✦ 리아', 'ria', 'ally', 8, 14);
  spawnUnit('luna', '✧ 루나', 'luna', 'ally', 10, 14);

  if (idx === 0) {
    // 장면 1: 고대 숲 난전 (투구 보병, 고블린/척후병, 서리 늑대, 독거미, 수호 골렘, 비룡)
    spawnUnit('e1', '제국 중갑병', 'helmetKnight', 'enemy', 8, 6);
    spawnUnit('e2', '강철 척후병', 'helmetScout', 'enemy', 10, 6);
    spawnUnit('e3', '서리 늑대', 'wolf', 'enemy', 6, 6);
    spawnUnit('e4', '독거미', 'spider', 'enemy', 11, 7);
    spawnUnit('e5', '이끼 슬라임', 'slime', 'enemy', 7, 5);
    spawnUnit('e6', '사막 암살궁수', 'helmetArcher', 'enemy', 9, 4);
    spawnUnit('e7', '수호 골렘', 'golem', 'enemy', 8, 4, 1.28, true);
    spawnUnit('e8', '아르카 비룡', 'dragon', 'enemy', 10, 4, 1.2, true);
  } else if (idx === 1) {
    // 장면 2: 에테르 수로 도하 (양쪽 다리를 지키는 적들과 강 건너 포격진)
    spawnUnit('e1', '다리 수비병', 'helmetKnight', 'enemy', 5, 7);
    spawnUnit('e2', '강철 척후병', 'helmetScout', 'enemy', 12, 7);
    spawnUnit('e3', '화염 늑대', 'wolf', 'enemy', 6, 6, 1, false, 0xe05a35);
    spawnUnit('e4', '늪지 사냥꾼', 'spider', 'enemy', 11, 6, 1, false, 0x62866d);
    spawnUnit('e5', '물안개 유령', 'ghost', 'enemy', 8, 5, 1, false, 0x83bac4);
    spawnUnit('e6', '잿불 궁수', 'helmetArcher', 'enemy', 5, 5);
    spawnUnit('e7', '사막 궁수', 'helmetArcher', 'enemy', 12, 5);
    spawnUnit('e8', '빙결 골렘', 'golem', 'enemy', 9, 4, 1.32, true, 0x8fc9e8);
  } else {
    // 장면 3: 코어 심층 보스전 (아르카 코어 + 근위대 포위망)
    spawnUnit('e1', '황실 근위병', 'helmetKnight', 'enemy', 7, 7);
    spawnUnit('e2', '황실 척후병', 'helmetScout', 'enemy', 10, 7);
    spawnUnit('e3', '에테르 망령', 'ghost', 'enemy', 6, 6, 1, false, 0xaaa5df);
    spawnUnit('e4', '폭풍 늑대', 'wolf', 'enemy', 11, 6, 1, false, 0xa9d8e8);
    spawnUnit('e5', '심연 골렘', 'golem', 'enemy', 7, 5, 1.18, false, 0x587b88);
    spawnUnit('e6', '아르카 비룡', 'dragon', 'enemy', 10, 5, 1.18, false, 0x514e71);
    spawnUnit('e7', '제국 저격병', 'helmetArcher', 'enemy', 8, 4);
    spawnUnit('e8', '아르카 코어', 'arcacore', 'enemy', 9, 4, 1.55, true);
  }
}

async function run30SecChoreography(idx, token) {
  const sceneTitles = [
    'SCENE 1 · 엘렌 고대 숲 18×18 총력전',
    'SCENE 2 · 에테르 수로 교량 돌파전',
    'SCENE 3 · 코어 심층 최종 결전'
  ];

  // [0.0s ~ 3.0s] 18×18 전체 전장 와이드 줌아웃 조망
  setCameraTarget(0, 0, 0.76, 0.55, '18×18 대형 전장 전체 조망: 아군 6인과 몬스터 군단이 대치합니다.', sceneTitles[idx]);
  await wait(2600, token); if (token !== runToken) return;

  // [3.0s ~ 6.5s] 브란 & 카일 선봉 돌격 + 적 전열 충돌
  setCameraTarget(-0.5, 1.0, 1.35, 0.35, '선봉장 브란과 카일이 전진하여 투구 쓴 제국 보병들을 강타합니다!', '⬟ 브란 · 실드 배시 & 도발');
  await Promise.all([
    moveUnit('bran', idx === 1 ? 5 : 8, 9, 700, token),
    moveUnit('kyle', idx === 1 ? 12 : 9, 9, 700, token),
    moveUnit('e1', idx === 1 ? 5 : 8, 8, 700, token),
    moveUnit('e2', idx === 1 ? 12 : 10, 8, 700, token)
  ]);
  if (token !== runToken) return;
  await meleeStrike('bran', 'e1', 54, false, 0xffd257, token);
  await meleeStrike('kyle', 'e2', 66, false, 0x56f2cb, token);
  if (token !== runToken) return;

  // [6.5s ~ 10.5s] 세라의 고지대 화살비 (광역 원거리 사격)
  setCameraTarget(1.5, -0.5, 1.22, -0.45, '궁수 세라가 후방에서 도약하며 적 무리에 화살비를 쏟아붓습니다!', '➶ 세라 · 화살비 (Arrow Volley)');
  await moveUnit('sera', 11, 10, 600, token);
  await Promise.all([
    moveUnit('e3', 7, 8, 550, token),
    moveUnit('e4', 11, 8, 550, token)
  ]);
  if (token !== runToken) return;
  await arrowVolley('sera', ['e1', 'e2', 'e4'], 58, 0x9effa9, token);
  if (token !== runToken) return;

  // [10.5s ~ 14.5s] 적군 반격 & 네로의 초고속 후방 암습 (치명타 클로즈업!)
  setCameraTarget(-1.5, -1.0, 1.15, 0.75, '적들의 반격! 그 틈을 타 도적 네로가 적 진영 배후로 침투합니다!', '◈ 네로 · 그림자 찌르기 (CRITICAL)');
  await meleeStrike('e3', 'bran', 32, false, 0xff6666, token);
  await moveUnit('nero', 6, 7, 550, token);
  if (token !== runToken) return;
  // 치명타 시 카메라는 급격히 2.25배 줌인
  setCameraTarget(-2.2, -1.8, 2.25, 0.95, '치명타 연출! 네로가 후방에서 적을 단숨에 베어 넘깁니다!');
  await meleeStrike('nero', 'e3', 118, true, 0x7de8ff, token);
  if (token !== runToken) return;

  // [14.5s ~ 18.5s] 리아의 프로스트 / 회오리 폭풍 & 루나의 생명의 기적
  setCameraTarget(0, -1.2, 1.12, -0.25, '사제 루나가 아군을 치유하고, 마도사 리아가 냉기 마법으로 적들을 얼립니다!', '✧ 루나 · 생명의 기적 & ✦ 리아 · 프로스트');
  await areaSpell('luna', 8, 9, ['bran', 'kyle', 'nero'], 65, 'heal', token);
  await moveUnit('ria', 8, 10, 500, token);
  await Promise.all([
    moveUnit('e5', 8, 7, 500, token),
    moveUnit('e6', 9, 6, 500, token)
  ]);
  if (token !== runToken) return;
  await areaSpell('ria', 8, 7, ['e1', 'e2', 'e4', 'e5'], 74, 'ice', token);
  if (token !== runToken) return;

  // [18.5s ~ 23.0s] 대형 몬스터(골렘·비룡·코어) 진격 & 세라/네로 협공
  setCameraTarget(0.5, -2.8, 1.38, 0.4, '거대 몬스터가 전면에 나서자 세라의 관통 사격과 네로의 월식이 작렬합니다!', '➶ 매의 심판 & ◈ 월식 (Eclipse)');
  await Promise.all([
    moveUnit('e7', 8, 6, 650, token),
    moveUnit('e8', 9, 6, 650, token),
    moveUnit('kyle', 9, 7, 650, token),
    moveUnit('bran', 8, 7, 650, token)
  ]);
  if (token !== runToken) return;
  await arrowVolley('sera', ['e6', 'e7', 'e8'], 72, 0xffe066, token);
  await moveUnit('nero', 7, 6, 480, token);
  await meleeStrike('nero', 'e7', 88, true, 0xc38fff, token);
  if (token !== runToken) return;

  // [23.0s ~ 27.5s] 클라이맥스: 리아의 궁극기 메테오 + 카일의 아르카 참격!
  setCameraTarget(0.2, -2.5, 1.85, -0.65, '클라이맥스! 리아의 궁극기 메테오와 카일의 아르카 참격이 적 본진을 초토화합니다!', '✦ 궁극기 · 메테오 & ⚔ 아르카 참격');
  await areaSpell('ria', 9, 6, ['e5', 'e6', 'e7', 'e8'], 135, 'fire', token);
  if (token !== runToken) return;
  await areaSpell('kyle', 9, 6, ['e7', 'e8'], 120, 'holy', token);
  await meleeStrike('kyle', 'e8', 145, true, 0xfff3a1, token);
  if (token !== runToken) return;

  // 남은 적 잔당 소멸 처리
  for (const [id, u] of units) {
    if (u.team === 'enemy' && u.alive) killUnit(id, token);
  }

  // [27.5s ~ 30.0s] 전장 줌아웃 및 6인 영웅 승리 포즈
  sfx('fanfare');
  setCameraTarget(0, -1.0, 0.85, 0.3, '30초 총력전 완료! 6인의 영웅이 18×18 전장을 완벽히 제압했습니다.', '✧ VICTORY · 전투 승리 ✧');
  await wait(2500, token);
}

function startScene(idx) {
  runToken++;
  currentSceneIdx = idx;
  sceneStartTime = performance.now();
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  build18x18Map(idx);
  setupSceneUnits(idx);
  run30SecChoreography(idx, runToken);
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => startScene(Number(btn.dataset.scene)));
});
document.getElementById('replayBtn').addEventListener('click', () => startScene(currentSceneIdx));

// =========================================================
// 7. 화면 리사이즈, 수동 조작, 메인 렌더링 루프
// =========================================================
function resize() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h, span = 8.8;
  camera.left = -span * aspect;
  camera.right = span * aspect;
  camera.top = span;
  camera.bottom = -span;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

let dragging = false, prevX = 0;
canvas.addEventListener('pointerdown', e => { unlockAudio(); dragging = true; prevX = e.clientX; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!dragging) return; targetAngle -= (e.clientX - prevX) * 0.01; prevX = e.clientX; });
canvas.addEventListener('pointerup', () => dragging = false);
canvas.addEventListener('wheel', e => { e.preventDefault(); targetZoom = Math.max(0.65, Math.min(2.5, targetZoom - e.deltaY * 0.001)); }, { passive: false });

let lastFrame = performance.now();
function renderLoop(now) {
  requestAnimationFrame(renderLoop);
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;

  // 30초 타이머 및 상단 진행바 업데이트
  const elapsed = Math.min(30, (now - sceneStartTime) / 1000);
  document.getElementById('timerDisplay').textContent = `${elapsed.toFixed(1).padStart(4, '0')}s / 30.0s`;
  document.getElementById('progressBar').style.width = `${(elapsed / 30) * 100}%`;

  // 카메라 부드러운 줌/회전/패닝 보간
  camAngle += (targetAngle - camAngle) * Math.min(1, dt * 4.5);
  camZoom += (targetZoom - camZoom) * Math.min(1, dt * 5.0);
  camLook.lerp(targetLook, Math.min(1, dt * 5.5));

  camera.zoom = camZoom;
  camera.updateProjectionMatrix();
  camera.position.set(
    camLook.x + Math.sin(camAngle) * 22,
    20 + camLook.y,
    camLook.z + Math.cos(camAngle) * 22
  );
  if (shakePower > 0.002) {
    camera.position.x += (Math.random() - 0.5) * shakePower;
    camera.position.y += (Math.random() - 0.5) * shakePower;
    shakePower *= Math.exp(-dt * 15);
  }
  camera.lookAt(camLook);

  // 유닛 숨쉬기 및 기울기 업데이트 + 라벨 위치 동기화
  let idx = 0;
  for (const u of units.values()) {
    idx++;
    if (!u.group.visible) continue;
    u.body.position.y = Math.sin(now * 0.004 + idx) * 0.028;
    u.body.rotation.x = u.leanX;
    u.body.rotation.z = u.leanZ;

    if (u.alive) {
      const p = project(u.group.position.clone().add(new THREE.Vector3(0, 1.38 * u.scale, 0)));
      u.tag.style.left = `${p.x}px`;
      u.tag.style.top = `${p.y}px`;
    }
  }

  // 파티클 물리 업데이트
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.life -= dt;
    pt.m.position.addScaledVector(pt.v, dt);
    pt.v.y -= dt * 5.2;
    pt.m.material.opacity = Math.max(0, pt.life);
    if (pt.life <= 0) {
      fxGroup.remove(pt.m);
      pt.m.geometry.dispose();
      pt.m.material.dispose();
      particles.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(renderLoop);
startScene(0);
</script>
